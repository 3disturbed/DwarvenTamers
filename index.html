<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="A single-player survival crafting adventure that runs entirely in your browser.">
  <title>SoloHiem</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script type="importmap">
    {
      "imports": {
        "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #fullscreen-btn {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 20px;
      line-height: 40px;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #fullscreen-btn:active {
      background: rgba(255,255,255,0.2);
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      max-width: min(480px, 85vw);
      height: auto;
    }
    #splash .loading-bar-track {
      width: min(320px, 60vw);
      height: 6px;
      background: #1a1a2e;
      border-radius: 3px;
      margin-top: 32px;
      overflow: hidden;
    }
    #splash .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #c9a84c, #e8d48b);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    #splash .loading-text {
      margin-top: 14px;
      color: #666;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    #system-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: min(520px, calc(100vw - 32px));
      padding: 12px 14px;
      border: 1px solid rgba(201, 168, 76, 0.55);
      border-radius: 10px;
      background: rgba(10, 10, 15, 0.94);
      color: #e8d48b;
      font: 600 13px/1.35 system-ui, sans-serif;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      transform: translate(-50%, calc(100% + 48px));
      opacity: 0;
      transition: transform 180ms ease, opacity 180ms ease;
      pointer-events: none;
    }
    #system-toast.visible {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }
    #system-toast button {
      flex: none;
      padding: 7px 11px;
      border: 1px solid #c9a84c;
      border-radius: 6px;
      background: #c9a84c;
      color: #111116;
      font: inherit;
      cursor: pointer;
    }
    #system-toast button:hover { background: #e8d48b; }
    #system-toast button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="./client/NordFolkLogo.png" alt="SoloHiem">
    <div class="loading-bar-track">
      <div class="loading-bar-fill" id="splash-bar"></div>
    </div>
    <div class="loading-text" id="splash-text">Loading...</div>
  </div>
  <canvas id="game"></canvas>
  <button id="fullscreen-btn" aria-label="Fullscreen">&#x26F6;</button>
  <div id="system-toast" role="status" aria-live="polite">
    <span id="system-toast-message"></span>
    <button id="system-toast-action" type="button" hidden></button>
  </div>
  <script type="module" src="./client/main.js"></script>
</body>
</html>
